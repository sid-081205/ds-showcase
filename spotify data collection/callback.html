<!DOCTYPE html>
<html>

<head>
    <title>Spotify OAuth Callback</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .container {
            text-align: center;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="spinner"></div>
        <h2>Completing authentication...</h2>
        <p id="status">Please wait...</p>
    </div>

    <script>
        async function handleCallback() {
            const status = document.getElementById('status');

            try {
                // Get the authorization code from URL
                const urlParams = new URLSearchParams(window.location.search);
                const code = urlParams.get('code');

                if (!code) {
                    status.textContent = 'Error: No authorization code received';
                    setTimeout(() => window.close(), 3000);
                    return;
                }

                status.textContent = 'Exchanging code for access token...';

                // Send the code to our backend
                const response = await fetch(`http://127.0.0.1:8888/callback?code=${code}`);
                const data = await response.json();

                if (data.success) {
                    status.textContent = 'Success! Closing window...';

                    // Notify parent window if it exists
                    if (window.opener) {
                        window.opener.postMessage({ type: 'spotify-auth-success', user: data.user }, '*');
                    }

                    // Close popup after short delay
                    setTimeout(() => window.close(), 1000);
                } else {
                    status.textContent = `Error: ${data.error}`;
                    setTimeout(() => window.close(), 3000);
                }

            } catch (error) {
                console.error('Callback error:', error);
                status.textContent = `Error: ${error.message}`;
                setTimeout(() => window.close(), 3000);
            }
        }

        // Run on page load
        handleCallback();
    </script>
</body>

</html>
